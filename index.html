<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Clock</title>
<style>
:root[data-theme="classic"] {
  --bg: #000; --card: #1a1a1a; --card2: #141414;
  --digit: #ccc; --label: #888; --glow: none; --line: #000;
}
:root[data-theme="hacker"] {
  --bg: #000; --card: #001a00; --card2: #001200;
  --digit: #00ff41; --label: #00a02a; --glow: 0 0 12px #00ff41; --line: #000;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: var(--bg); overflow: hidden; height: 100vh;
  font-family: "Arial Black", "Helvetica Neue", Helvetica, sans-serif;
  font-weight: 900; cursor: default;
}
#stage {
  position: absolute; inset: 0; margin: auto;
  width: max-content; height: max-content;
  transform-origin: center center;
}
#cards { display: flex; gap: 24px; }
.card {
  position: relative; width: 300px; height: 400px;
  perspective: 900px; border-radius: 24px; overflow: hidden;
  background: var(--card);
}
.half {
  position: absolute; left: 0; width: 100%; height: 50%;
  overflow: hidden; backface-visibility: hidden;
}
.half.top    { top: 0;    border-bottom: 1px solid var(--line); background: var(--card); }
.half.bottom { bottom: 0; background: var(--card2); }
.half span {
  position: absolute; left: 0; width: 100%; height: 400px;
  line-height: 400px; text-align: center; font-size: 300px;
  color: var(--digit); text-shadow: var(--glow);
}
.half.top    span { top: 0; }
.half.bottom span { bottom: 0; }
.half.flap { z-index: 2; }
.half.top.flap    { transform-origin: bottom center; }
.half.bottom.flap { transform-origin: top center; transform: rotateX(90deg); }
.card:not(.flipping) .half.flap { display: none; }
.card.flipping .half.top.flap    { animation: flipTop    .15s linear forwards; }
.card.flipping .half.bottom.flap { animation: flipBottom .15s linear .15s forwards; }
@keyframes flipTop    { to { transform: rotateX(-90deg); } }
@keyframes flipBottom { to { transform: rotateX(0deg); } }
#date {
  margin-top: 28px; text-align: center; font-size: 34px;
  color: var(--label); text-shadow: var(--glow); letter-spacing: .06em;
}
#date[hidden] { display: none; }
#panel {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  max-width: 92vw; padding: 10px 16px; border-radius: 12px;
  background: rgba(128,128,128,.22); backdrop-filter: blur(10px);
  color: #fff; font: 400 13px/1 system-ui, sans-serif; z-index: 100;
  transition: opacity .2s, visibility .2s;
}
body:not(.hover) #panel { opacity: 0; visibility: hidden; }
#panel label { display: flex; gap: 6px; align-items: center; }
#panel input[type=range] { width: 90px; }
#cards { position: relative; }
#cards::before {
  content: attr(data-suffix);
  position: absolute; left: 22px; top: 300px; z-index: 3;
  font-size: 40px; color: var(--label); text-shadow: var(--glow);
  pointer-events: none;
}
#cards[data-suffix=""]::before { content: none; }
#panel label[hidden] { display: none; }
#panel .sep { width: 1px; height: 20px; background: rgba(255,255,255,.3); }
#panel input[type=number] { width: 52px; }
#panel button { padding: 5px 12px; border: 0; border-radius: 6px; cursor: pointer; }
#tm-status {
  margin-top: 16px; text-align: center; font-size: 26px;
  color: var(--label); text-shadow: var(--glow); letter-spacing: .08em;
}
#tm-status:empty { display: none; }
body.alarming #cards { animation: blink .6s steps(1) infinite; }
@keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
  <div id="stage">
    <div id="cards"></div>
    <div id="date" hidden></div>
    <div id="tm-status"></div>
  </div>

  <div id="panel">
    <label><input type="checkbox" id="opt-seconds"> Giây</label>
    <label><input type="checkbox" id="opt-date"> Ngày tháng</label>
    <label><input type="checkbox" id="opt-24h"> 24 giờ</label>
    <label>Theme
      <select id="opt-theme">
        <option value="classic">Classic</option>
        <option value="hacker">Hacker</option>
      </select>
    </label>
    <label>Cỡ <input type="range" id="opt-scale" min="50" max="100"></label>
    <label>Sáng <input type="range" id="opt-brightness" min="50" max="100"></label>
    <span class="sep"></span>
    <label>Chế độ
      <select id="tm-mode">
        <option value="off">Tắt</option>
        <option value="countdown">Đếm ngược</option>
        <option value="pomodoro">Pomodoro</option>
        <option value="alarm">Hẹn giờ</option>
      </select>
    </label>
    <label id="tm-countdown-box" hidden>Phút <input type="number" id="tm-minutes" min="1" max="600" value="10"></label>
    <label id="tm-alarm-box" hidden>Lúc <input type="time" id="tm-at" value="07:30"></label>
    <label id="tm-pomo-box" hidden>
      Focus <input type="number" id="tm-focus" min="1" max="180" value="25">
      Nghỉ <input type="number" id="tm-break" min="1" max="60" value="5">
      Dài <input type="number" id="tm-long" min="1" max="60" value="15">
      Chu kỳ <input type="number" id="tm-cycles" min="1" max="12" value="4">
    </label>
    <button id="tm-start">Bắt đầu</button>
  </div>

  <script src="music/tracks.js"></script>
  <script src="clock.js"></script>
  <script src="timer.js"></script>
  <script src="audio.js"></script>
  <script src="settings.js"></script>
  <script src="timer-ui.js"></script>
</body>
</html>
