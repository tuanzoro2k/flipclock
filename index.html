<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Clock</title>
<style>
:root {
  /* Geometry doc goc: fs la font-size mot o so. Moi thu khac (kich thuoc
     the, chieu cao/line-height so...) tinh theo fs
     bang calc() de khong bao gio lech nhau nua. */
  --fs: 300px;
  /* Do rong can cho 2 ky tu, do bang canvas.measureText('88') voi font
     900 var(--fs) "Arial Black" tren Chrome thuc te: ~1.334em (2 x 0.667em
     mot chu so). Doi font thi PHAI do lai so nay. */
  --card-w: calc(var(--fs) * 1.334 + var(--fs) * 0.3);
  --card-h: calc(var(--fs) * 4 / 3);
  --gap: calc(var(--fs) * 0.08);
}
:root[data-theme="classic"] {
  --bg: #000; --card: #1a1a1a; --card2: #141414;
  --digit: #ccc; --label: #888; --glow: none; --line: #000;
}
:root[data-theme="hacker"] {
  --bg: #000; --card: #001a00; --card2: #001200;
  --digit: #00ff41; --label: #00a02a; --glow: 0 0 12px #00ff41; --line: #000;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: var(--bg); overflow: hidden; height: 100vh;
  font-family: "Arial Black", "Helvetica Neue", Helvetica, sans-serif;
  font-weight: 900; cursor: default;
}
#stage {
  position: absolute; inset: 0; margin: auto;
  width: max-content; height: max-content;
  transform-origin: center center;
}
#cards { display: flex; gap: var(--gap); }
.card {
  position: relative; width: var(--card-w); height: var(--card-h);
  perspective: 900px; border-radius: 24px; overflow: hidden;
  background: var(--card);
}
.half {
  position: absolute; left: 0; width: 100%; height: 50%;
  overflow: hidden; backface-visibility: hidden;
}
.half.top    { top: 0;    border-bottom: 1px solid var(--line); background: var(--card); }
.half.bottom { bottom: 0; background: var(--card2); }
.half span {
  position: absolute; left: 0; width: 100%; height: var(--card-h);
  line-height: var(--card-h); text-align: center; font-size: var(--fs);
  color: var(--digit); text-shadow: var(--glow);
}
.half.top    span { top: 0; }
.half.bottom span { bottom: 0; }
.half.flap { z-index: 2; }
.half.top.flap    { transform-origin: bottom center; }
.half.bottom.flap { transform-origin: top center; transform: rotateX(90deg); }
.card:not(.flipping) .half.flap { display: none; }
.card.flipping .half.top.flap    { animation: flipTop    .15s linear forwards; }
.card.flipping .half.bottom.flap { animation: flipBottom .15s linear .15s forwards; }
@keyframes flipTop    { to { transform: rotateX(-90deg); } }
@keyframes flipBottom { to { transform: rotateX(0deg); } }
#date {
  margin-top: 28px; text-align: center; font-size: 34px;
  color: var(--label); text-shadow: var(--glow); letter-spacing: .06em;
}
#date[hidden] { display: none; }
#panel {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  max-width: 92vw; padding: 10px 16px; border-radius: 12px;
  background: rgba(128,128,128,.22); backdrop-filter: blur(10px);
  color: #fff; font: 400 13px/1 system-ui, sans-serif; z-index: 100;
  transition: opacity .2s, visibility .2s;
}
body:not(.hover) #panel { opacity: 0; visibility: hidden; }
#panel label { display: flex; gap: 6px; align-items: center; }
#panel input[type=range] { width: 90px; }
#panel label[hidden] { display: none; }
#panel .sep { width: 1px; height: 20px; background: rgba(255,255,255,.3); }
#panel input[type=number] { width: 52px; }
#panel button { padding: 5px 12px; border: 0; border-radius: 6px; cursor: pointer; }
#tm-status {
  margin-top: 16px; text-align: center; font-size: 26px;
  color: var(--label); text-shadow: var(--glow); letter-spacing: .08em;
}
#tm-status:empty { display: none; }
body.alarming #cards { animation: blink .6s steps(1) infinite; }
@keyframes blink { 50% { opacity: .3; } }
#music-box { display: flex; gap: 6px; align-items: center; }
#music-box [hidden] { display: none; }
#mu-pick-label { cursor: pointer; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.15); }
#yt-form, #vol-box { display: flex; gap: 6px; align-items: center; }
#yt-url { width: 200px; }
#yt-status { font-size: 12px; opacity: .85; max-width: 320px; }
#yt-status a { color: #6cf; text-decoration: underline; }
#yt-box {
  position: fixed; left: 16px; bottom: 16px; z-index: 150;
  border-radius: 8px; overflow: hidden; line-height: 0;
  box-shadow: 0 4px 16px rgba(0,0,0,.6);
}
#yt-box[hidden] { display: none; }
#yt-close, #yt-min {
  position: absolute; top: 4px; z-index: 1;
  border: 0; border-radius: 4px; cursor: pointer; line-height: 1;
  padding: 2px 6px; background: rgba(0,0,0,.65); color: #fff;
}
#yt-close { right: 4px; }
#yt-min { right: 32px; }
/* Thu nho chu khong an: khung player van hien, chi bot chiem cho. */
#yt-box.thu-nho iframe { width: 112px; height: 63px; }
#yt-box.thu-nho #yt-close, #yt-box.thu-nho #yt-min {
  padding: 0 4px; font-size: 11px; top: 2px;
}
#yt-box.thu-nho #yt-close { right: 2px; }
#yt-box.thu-nho #yt-min { right: 20px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="cards"></div>
    <div id="date" hidden></div>
    <div id="tm-status"></div>
  </div>

  <div id="panel">
    <label><input type="checkbox" id="opt-seconds"> Giây</label>
    <label><input type="checkbox" id="opt-date"> Ngày tháng</label>
    <label>Theme
      <select id="opt-theme">
        <option value="classic">Classic</option>
        <option value="hacker">Hacker</option>
      </select>
    </label>
    <label>Cỡ <input type="range" id="opt-scale" min="50" max="100"></label>
    <label>Sáng <input type="range" id="opt-brightness" min="50" max="100"></label>
    <span class="sep"></span>
    <label>Chế độ
      <select id="tm-mode">
        <option value="off">Tắt</option>
        <option value="countdown">Đếm ngược</option>
        <option value="pomodoro">Pomodoro</option>
        <option value="alarm">Hẹn giờ</option>
      </select>
    </label>
    <label id="tm-countdown-box" hidden>Phút <input type="number" id="tm-minutes" min="1" max="600" value="10"></label>
    <label id="tm-alarm-box" hidden>Lúc <input type="time" id="tm-at" value="07:30"></label>
    <label id="tm-pomo-box" hidden>
      Focus <input type="number" id="tm-focus" min="1" max="180" value="25">
      Nghỉ <input type="number" id="tm-break" min="1" max="60" value="5">
      Chu kỳ <input type="number" id="tm-cycles" min="1" max="12" value="4">
    </label>
    <button id="tm-start">Bắt đầu</button>
    <span class="sep"></span>
    <span id="music-box">
      <label id="mu-pick-label" for="mu-pick">🎵 Chọn nhạc</label>
      <input type="file" id="mu-pick" accept="audio/*" multiple hidden>
      <button id="mu-play" hidden>▶</button>
      <button id="mu-next" hidden>▶▶</button>
      <select id="mu-track" hidden></select>
      <button id="mu-del" title="Xóa bài đang chọn khỏi danh sách" hidden>✕</button>
    </span>
    <span id="vol-box" title="Âm lượng (cả nhạc từ máy lẫn YouTube)">
      🔊 <input type="range" id="mu-vol" min="0" max="100" value="50">
    </span>
    <span class="sep"></span>
    <span id="yt-form">
      <input type="text" id="yt-url" placeholder="Dán link YouTube / playlist" size="26">
      <button id="yt-go">Phát</button>
      <button id="yt-prev" title="Bài trước trong playlist" hidden>⏮</button>
      <button id="yt-next" title="Bài kế tiếp trong playlist" hidden>⏭</button>
      <span id="yt-status"></span>
    </span>
  </div>

  <!-- Dieu khoan YouTube cam tach rieng phan tieng, va IFrame API doi khung
       player khong bi che — nen o nay hien khi dang phat chu khong an di. -->
  <div id="yt-box" hidden>
    <div id="yt-player"></div>
    <button id="yt-min" title="Thu nhỏ / phóng lại">–</button>
    <button id="yt-close" title="Dừng và đóng">✕</button>
  </div>

  <script src="music/tracks.js"></script>
  <script src="clock.js"></script>
  <script src="timer.js"></script>
  <script src="audio.js"></script>
  <script src="youtube.js"></script>
  <script src="settings.js"></script>
  <script src="timer-ui.js"></script>
</body>
</html>
